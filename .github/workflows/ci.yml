name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-vet-test:
    name: build-vet-test (${{ matrix.os }})
    strategy:
      # Run every OS leg to completion so a failure on one does not hide the others.
      fail-fast: false
      matrix:
        # Windows and macOS are the tray app's targets; Linux keeps the core
        # and CLI honest on a second Unix.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod pins `go 1.26`; read it from there so the two cannot drift.
          go-version-file: go.mod
          # Caches GOMODCACHE and GOCACHE, keyed on go.sum.
          cache: true

      # Wails v3 (the tray app) links GTK 4 and WebKitGTK 6.0 on Linux; on
      # Windows and macOS it needs nothing beyond the toolchain.
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
